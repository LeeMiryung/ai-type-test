<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 AI 유형 테스트 – 먼작귀 편</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ef;--card:#ffffff;--ink:#4a3b32;--sub:#8a7668;--line:#f0dfcc;--pt:#ff8fa3;--pt2:#ffd6dd;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2320;--card:#382e29;--ink:#fbeee0;--sub:#c3ad9b;--line:#4d3f37;--pt:#ff8fa3;--pt2:#5a3a41;--on:#2a2320}}
:root[data-theme="dark"]{--bg:#2a2320;--card:#382e29;--ink:#fbeee0;--sub:#c3ad9b;--line:#4d3f37;--pt:#ff8fa3;--pt2:#5a3a41;--on:#2a2320}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;min-height:100vh;display:flex;justify-content:center;padding:20px 16px 40px}
main{width:100%;max-width:460px}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:26px 22px;text-align:center}
h1{font-size:28px;line-height:1.3;margin:10px 0 8px}
p{margin:0 0 14px;color:var(--sub);font-size:16px}
.cast{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:6px 0 14px}
.cast svg{width:30%;max-width:120px;height:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:14px 18px;font-size:18px}
button:focus-visible{outline:3px solid var(--pt);outline-offset:3px}
.go{background:var(--pt);color:var(--on);width:100%;font-size:20px}
.go:active{transform:scale(.97)}
.ghost{background:var(--pt2);color:var(--ink)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--pt);width:0;transition:width .3s}
.q{font-size:21px;line-height:1.45;margin:6px 0 18px;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{background:var(--bg);color:var(--ink);border:2px solid var(--line);text-align:left;font-size:17px;line-height:1.45;border-radius:16px}
.opt:hover{border-color:var(--pt)}
.cnt{color:var(--sub);font-size:15px;text-align:right;margin:0 0 4px}
.badge{display:inline-block;background:var(--pt2);color:var(--ink);padding:3px 14px;border-radius:20px;font-size:15px}
.art{width:min(260px,70%);margin:12px auto 0;display:block;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.art{animation:none}.bar i{transition:none}}
.res h2{font-size:30px;margin:6px 0 2px}
.res .one{font-size:19px;color:var(--ink);margin-bottom:14px}
.res p{text-align:left;color:var(--ink)}
.box{text-align:left;background:var(--bg);border-radius:16px;padding:12px 16px;margin:0 0 12px;font-size:16px}
.box b{display:block;color:var(--pt);margin-bottom:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.fine{font-size:12px;color:var(--sub);text-align:center;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="start" class="card">
  <span class="badge">로그인 없이 30초</span>
  <h1>나는 어떤 AI 사용자?<br>먼작귀 유형 테스트</h1>
  <p>질문 5개로 알아보는 나의 AI 활용 스타일. 당신은 어느 캐릭터와 닮았을까요?</p>
  <p>치이카와, 하치와레, 우사기, 모몽가, 시사, 갑옷아저씨 중 나는 누구?</p>
  <button class="go" id="startBtn">테스트 시작하기</button>
</section>

<section id="quiz" class="card" hidden>
  <div class="cnt" id="cnt"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
</section>

<section id="result" class="card res" hidden>
  <span class="badge" id="rBadge"></span>
  
  <h2 id="rName"></h2>
  <div class="one" id="rOne"></div>
  <p id="rDesc"></p>
  <div class="box"><b>이런 사용 습관이 있어요</b><span id="rHab"></span></div>
  <div class="box"><b>이렇게 써보세요</b><span id="rTip"></span></div>
  <div class="box"><b>찰떡궁합 유형</b><span id="rMate"></span></div>
  <div class="row">
    <button class="go" id="shareBtn">결과 공유하기</button>
    <button class="ghost" id="copyBtn">링크 복사</button>
  </div>
  <button class="ghost" id="again" style="width:100%;margin-top:10px">다시 하기</button>
</section>
<p class="fine">팬이 만든 비공식 테스트입니다.</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// ---- 캐릭터 일러스트 (인라인 SVG) ----
const eyes=(x1,x2,y,r=6)=>`<circle cx="${x1}" cy="${y}" r="${r}" fill="#3b2f2a"/><circle cx="${x2}" cy="${y}" r="${r}" fill="#3b2f2a"/><circle cx="${x1-2}" cy="${y-2}" r="2" fill="#fff"/><circle cx="${x2-2}" cy="${y-2}" r="2" fill="#fff"/>`;
const cheeks=(y)=>`<ellipse cx="62" cy="${y}" rx="9" ry="6" fill="#ffb3bf" opacity=".8"/><ellipse cx="138" cy="${y}" rx="9" ry="6" fill="#ffb3bf" opacity=".8"/>`;
const wrap=s=>`<svg class="art" viewBox="0 0 200 200" role="img" aria-hidden="true">${s}<ellipse cx="100" cy="188" rx="48" ry="6" fill="#000" opacity=".08"/></svg>`;
const ART={
chii:()=>wrap(`<ellipse cx="62" cy="48" rx="16" ry="22" fill="#fff" stroke="#4a3b32" stroke-width="4"/><ellipse cx="138" cy="48" rx="16" ry="22" fill="#fff" stroke="#4a3b32" stroke-width="4"/><ellipse cx="100" cy="115" rx="68" ry="64" fill="#fff" stroke="#4a3b32" stroke-width="4"/><path d="M90 52q10-18 20 0" fill="none" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>${eyes(78,122,108)}${cheeks(126)}<path d="M92 126q8 7 16 0" fill="none" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/><path d="M148 100q10 8 4 18" fill="none" stroke="#7ec8ff" stroke-width="5" stroke-linecap="round"/>`),
hachi:()=>wrap(`<path d="M44 66l8-40 34 22z" fill="#fff" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/><path d="M156 66l-8-40-34 22z" fill="#fff" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/><ellipse cx="100" cy="115" rx="70" ry="62" fill="#fff" stroke="#4a3b32" stroke-width="4"/><path d="M34 100q66-70 132 0q-20-24-66-26q-46 2-66 26z" fill="#a9dcf5"/><path d="M34 100q66-70 132 0" fill="none" stroke="#4a3b32" stroke-width="4"/>${eyes(76,124,112)}${cheeks(128)}<path d="M92 128q8 8 16 0" fill="none" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>`),
usagi:()=>wrap(`<ellipse cx="70" cy="42" rx="14" ry="42" fill="#fff6bf" stroke="#4a3b32" stroke-width="4" transform="rotate(-8 70 42)"/><ellipse cx="130" cy="42" rx="14" ry="42" fill="#fff6bf" stroke="#4a3b32" stroke-width="4" transform="rotate(8 130 42)"/><ellipse cx="100" cy="122" rx="66" ry="58" fill="#fff6bf" stroke="#4a3b32" stroke-width="4"/>${eyes(76,124,108,7)}${cheeks(126)}<path d="M80 128q20 34 40 0z" fill="#e5586e" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/><path d="M92 142q8-6 16 0" fill="none" stroke="#ff9db0" stroke-width="5" stroke-linecap="round"/>`),
momo:()=>wrap(`<path d="M30 104q-16 40 10 58l30-26zM170 104q16 40-10 58l-30-26z" fill="#c9b8a6" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/><circle cx="58" cy="52" r="15" fill="#c9b8a6" stroke="#4a3b32" stroke-width="4"/><circle cx="142" cy="52" r="15" fill="#c9b8a6" stroke="#4a3b32" stroke-width="4"/><ellipse cx="100" cy="112" rx="60" ry="58" fill="#d9c9b8" stroke="#4a3b32" stroke-width="4"/><ellipse cx="100" cy="132" rx="34" ry="26" fill="#fff4e6"/>${eyes(76,124,100,9)}<ellipse cx="100" cy="122" rx="5" ry="4" fill="#4a3b32"/><path d="M92 134q8 8 16 0" fill="none" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>`),
shisa:()=>wrap(`<circle cx="100" cy="108" r="78" fill="#f2a65a" stroke="#4a3b32" stroke-width="4"/><circle cx="48" cy="50" r="17" fill="#f6c27e" stroke="#4a3b32" stroke-width="4"/><circle cx="152" cy="50" r="17" fill="#f6c27e" stroke="#4a3b32" stroke-width="4"/><ellipse cx="100" cy="116" rx="52" ry="48" fill="#ffe3b8" stroke="#4a3b32" stroke-width="4"/>${eyes(80,120,106)}<ellipse cx="100" cy="124" rx="8" ry="6" fill="#4a3b32"/><path d="M84 134q16 16 32 0" fill="none" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/><path d="M92 140h16" stroke="#e5586e" stroke-width="5" stroke-linecap="round"/>${cheeks(126)}`),
armor:()=>wrap(`<path d="M100 14q-12 20-8 34h16q4-14-8-34z" fill="#e5586e" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/><path d="M52 112q0-62 48-62t48 62v52H52z" fill="#b8c1cc" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/><rect x="62" y="92" width="76" height="26" rx="8" fill="#3b2f2a"/><circle cx="82" cy="105" r="5" fill="#fff"/><circle cx="118" cy="105" r="5" fill="#fff"/><path d="M52 150h96" stroke="#4a3b32" stroke-width="4"/><path d="M100 118v32" stroke="#8d97a3" stroke-width="4"/><circle cx="76" cy="136" r="5" fill="#8d97a3"/><circle cx="124" cy="136" r="5" fill="#8d97a3"/>`)
};

// ---- 유형 데이터 ----
const T={
chii:{n:"치이카와형",b:"겁 많은 노력파",o:"“이거 물어봐도 될까…?” 조심조심 AI 초보 탐험가",
d:"AI 앞에서도 일단 긴장부터 하는 당신. 하지만 한 번 익히면 누구보다 성실하게 따라 합니다. 모르는 건 모른다고 솔직하게 묻는 용기가 가장 큰 무기예요.",
h:"질문 전에 한참 고민하고, 답이 나오면 두세 번 되물어 확인해요. 가끔 울먹…하지만 끝까지 해냅니다.",
t:"‘초보자도 이해하게 설명해줘’라고 시작해 보세요. 작은 과제부터 하나씩 성공 경험을 쌓으면 금방 자신감이 붙어요.",m:"hachi"},
hachi:{n:"하치와레형",b:"든든한 실전 활용러",o:"“일단 해보자!” 꾸준하게 성과를 내는 AI 모범생",
d:"밝고 성실하게 AI를 일상 도구로 만든 사람. 일정 정리, 메일 초안, 공부까지 루틴처럼 척척 활용합니다. 화려하진 않아도 가장 오래 가는 타입이에요.",
h:"정해진 프롬프트 틀이 있고, 결과를 쓰기 전에 꼭 한 번 손봅니다. 주변에 AI 활용법도 잘 나눠 줘요.",
t:"자주 쓰는 프롬프트를 모아 나만의 템플릿집을 만들어 보세요. 다음 단계는 자동화 도전!",m:"chii"},
usagi:{n:"우사기형",b:"폭주하는 실험가",o:"“우라라라라!” 프롬프트를 쉬지 않고 던지는 에너지 덩어리",
d:"생각나면 바로 입력, 마음에 안 들면 바로 재생성! 속도와 기세로 밀어붙이는 당신 덕분에 AI도 쉴 틈이 없습니다. 엉뚱한 결과에서 대박 아이디어가 나오기도 해요.",
h:"탭이 열 개쯤 열려 있고, 질문 하나에 이미지·글·코드를 한꺼번에 시킵니다. 저장은 가끔 깜빡해요.",
t:"폭주 중간에 ‘좋았던 답변’만 따로 저장해 두세요. 요청을 한 줄 더 구체적으로 쓰면 효율이 두 배가 됩니다.",m:"armor"},
momo:{n:"모몽가형",b:"장난꾸러기 수다쟁이",o:"“나 좀 봐줘!” AI와 놀듯이 대화하는 관종 감성 크리에이터",
d:"AI는 도구이기 전에 놀이 친구! 드립 대결, 별명 짓기, 상황극까지 대화 자체를 즐깁니다. 덕분에 AI의 숨은 재능을 가장 잘 끌어내는 사람이기도 해요.",
h:"스크린샷을 찍어 친구에게 자랑하고, ‘너 오늘 기분 어때?’ 같은 질문을 먼저 던져요.",
t:"그 재치를 콘텐츠로 연결해 보세요. 캐릭터 설정을 주고 롤플레이를 시키면 글쓰기·기획에 큰 힘이 됩니다.",m:"shisa"},
shisa:{n:"시사형",b:"느긋한 여유파",o:"“필요할 때만 슥~” 여유롭게 쓰고 푹 쉬는 AI 도인",
d:"AI에 휘둘리지 않고 딱 필요한 만큼만 쓰는 평화주의자. 서두르지 않아도 핵심은 놓치지 않아요. 덕분에 AI 피로감과는 거리가 멉니다.",
h:"하루에 한두 번만 열어 보고, 결과가 마음에 들면 바로 닫아요. 나머지 시간은 여유롭게 즐깁니다.",
t:"가끔은 AI에게 반복 작업을 통째로 맡겨 보세요. 아낀 시간만큼 더 푹 쉴 수 있어요.",m:"momo"},
armor:{n:"갑옷아저씨형",b:"과묵한 고수",o:"“…한 번에 끝내지.” 말수는 적지만 정확한 숙련자",
d:"긴 설명 없이 조건·형식·분량을 딱 짚어 요청하는 프로. 결과가 마음에 안 들면 말없이 조건을 고쳐 다시 입력합니다. 묵직한 한 방의 미학이에요.",
h:"프롬프트는 짧고 단단하며, 출력 형식을 먼저 정합니다. 결과 검증도 철저해요.",
t:"그 노하우를 문서로 남겨 팀에 공유해 보세요. 초보 캐릭터들에게는 든든한 멘토가 될 거예요.",m:"usagi"}
};

// 선택지: [문장, 1순위(2점), 2순위(1점)]
const Q=[
{q:"처음 보는 AI 서비스를 열었다. 당신의 첫 행동은?",o:[["일단 ‘안녕?’부터 보내 보고 반응을 살핀다","momo","chii"],["사용법 안내부터 꼼꼼히 읽는다","chii","hachi"],["생각나는 대로 이것저것 막 시켜 본다","usagi","momo"],["필요한 기능만 확인하고 바로 닫는다","shisa","armor"]]},
{q:"AI가 틀린 답을 줬다. 이때 당신은?",o:[["‘내가 잘못 물었나…’ 하며 조심스레 다시 묻는다","chii","shisa"],["출처와 근거를 확인하고 차근차근 고친다","hachi","armor"],["‘다시 생성!’을 연타한다","usagi","hachi"],["조건을 한 줄 고쳐 정확히 다시 요청한다","armor","hachi"]]},
{q:"AI에게 가장 자주 시키는 일은?",o:[["일정·메일·공부 같은 일상 루틴 정리","hachi","shisa"],["드립, 별명, 상황극 같은 수다와 놀이","momo","usagi"],["보고서·코드처럼 결과물이 분명한 작업","armor","hachi"],["생각 정리나 가벼운 고민 상담","shisa","chii"]]},
{q:"AI에게 요청하는 프롬프트의 모습은?",o:[["정중하고 길게, ‘혹시 가능할까요?’로 시작","chii","hachi"],["늘 쓰는 틀에 내용만 바꿔 넣는다","hachi","armor"],["한 번에 여러 개를 와르르 시킨다","usagi","momo"],["짧고 간결하게, 형식과 분량부터 지정","armor","shisa"]]},
{q:"AI 덕분에 시간이 남았다. 무엇을 할까?",o:[["남은 시간에 새로운 AI 기능을 또 실험한다","usagi","hachi"],["낮잠이나 산책으로 푹 쉰다","shisa","chii"],["결과를 친구들에게 보여 주며 자랑한다","momo","usagi"],["내용을 한 번 더 검토해 완성도를 높인다","chii","armor"]]}
];

// ---- 앱 로직 ----
const $=id=>document.getElementById(id);
let i=0,score,picked;
const show=id=>["start","quiz","result"].forEach(s=>$(s).hidden=s!==id);


function reset(){i=0;score={chii:0,hachi:0,usagi:0,momo:0,shisa:0,armor:0};picked=[]}
function render(){
  const d=Q[i];
  $("cnt").textContent=`${i+1} / ${Q.length}`;
  $("bar").style.width=(i/Q.length*100)+"%";
  $("q").textContent=d.q;
  $("opts").innerHTML="";
  d.o.forEach((o,idx)=>{
    const b=document.createElement("button");
    b.className="opt";b.textContent=o[0];
    b.onclick=()=>choose(idx);
    $("opts").appendChild(b);
  });
}
function choose(idx){
  const o=Q[i].o[idx];
  score[o[1]]+=2;score[o[2]]+=1;
  i++;
  if(i<Q.length)render();else finish();
}
function finish(){
  $("bar").style.width="100%";
  const keys=Object.keys(T);
  const k=keys.reduce((a,b)=>score[b]>score[a]?b:a,keys[0]);
  const t=T[k];
  $("rBadge").textContent=t.b;
  
  $("rName").textContent=t.n;
  $("rOne").textContent=t.o;
  $("rDesc").textContent=t.d;
  $("rHab").textContent=t.h;
  $("rTip").textContent=t.t;
  $("rMate").textContent=T[t.m].n+" · "+T[t.m].b;
  window.__res=`나는 먼작귀 AI 유형 테스트에서 [${t.n}] 나왔어! ${t.o} 너는 어떤 유형일까?`;
  show("result");
  window.scrollTo({top:0,behavior:"smooth"});
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
function copy(text){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallback(text))}}catch(e){}
  return Promise.resolve(fallback(text));
}
function fallback(text){
  try{const a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(e){return false}
}
$("startBtn").onclick=()=>{reset();show("quiz");render()};
$("again").onclick=()=>{reset();show("start");window.scrollTo({top:0})};
$("shareBtn").onclick=async()=>{
  const url=location.href.split("#")[0];
  if(navigator.share){
    try{await navigator.share({title:"먼작귀 AI 유형 테스트",text:window.__res,url});return}catch(e){if(e&&e.name==="AbortError")return}
  }
  const ok=await copy(window.__res+" "+url);
  toast(ok?"결과 문구를 복사했어요!":"복사에 실패했어요. 직접 선택해 복사해 주세요");
};
$("copyBtn").onclick=async()=>{
  const ok=await copy(location.href.split("#")[0]);
  toast(ok?"링크를 복사했어요!":"복사에 실패했어요");
};
reset();
</script>
